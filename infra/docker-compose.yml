# Local services besides Supabase (which runs via `supabase start`).
# Usage: docker compose -f infra/docker-compose.yml up --build
name: energy-price-predictor

services:
  forecast-api:
    build: ../services/forecast
    env_file:
      - path: ../.env
        required: false
    environment:
      APP_ENV: development
      FORECAST_INTERNAL_API_KEY: ${FORECAST_INTERNAL_API_KEY:-dev-internal-key}
      # Supabase local Postgres, reached from inside the container.
      FORECAST_DATABASE_URL: ${FORECAST_DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
