[project]
name = "forecast"
version = "0.1.0"
description = "Data ingestion, training and prediction service for Greek day-ahead electricity prices"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pandas>=3.0.6",
  "numpy>=2.4.6",
  "psycopg[binary]>=3.3.6",
  "tenacity>=9.1.4",
  "httpx>=0.28.1",
  "openpyxl>=3.1.5",
  "holidays>=0.105",
  "defusedxml>=0.7.1",
]

[project.scripts]
forecast = "forecast.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx2>=0.1",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forecast"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DTZ"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
